name: Deploy Website

on:
  push:
    branches: [ master ]
    paths:
      - 'website/**'
      - 'src/**'
      - '.github/workflows/deploy-website.yml'

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build website
        run: npm run website:build

      - name: Add CNAME
        run: echo "yam.yujia.io" > dist-website/CNAME

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist-website
          branch: gh-pages
